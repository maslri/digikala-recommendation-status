<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Recommendation classifier integration with an LLM system</title>
  <desc id="desc">A production flow in which an LLM orchestrator retrieves reviews, preserves observed labels, calls the XLM-RoBERTa classifier only for missing labels, aggregates results, and writes a grounded answer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102841"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#67e8f9"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#eaf4ff}.eyebrow{font-size:16px;letter-spacing:2px;fill:#5eead4}.title{font-size:40px;font-weight:750}.sub{font-size:18px;fill:#bdd3e7}.box{fill:#122b43;stroke:#2f5575;stroke-width:2}.box2{fill:#103a43;stroke:#2dd4bf;stroke-width:2}.name{font-size:22px;font-weight:700}.copy{font-size:15px;fill:#bad0e1}.tiny{font-size:13px;fill:#9eb8cc}.flow{fill:none;stroke:#67e8f9;stroke-width:3;marker-end:url(#arrow)}.pill{fill:#1b3854}.pilltext{font-size:13px;font-weight:650}.policy{fill:#302b1b;stroke:#fbbf24;stroke-width:2}.policytext{font-size:15px;fill:#fde68a}.step{fill:#0b1728;stroke:#31506d}.stepno{font-size:13px;font-weight:800;fill:#5eead4}.result{fill:url(#hero);stroke:#93c5fd;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="820" rx="28" fill="url(#bg)"/>
  <text x="70" y="66" class="eyebrow">PRODUCTION INTEGRATION</text>
  <text x="70" y="116" class="title">The classifier is a tool beside the LLM</text>
  <text x="70" y="151" class="sub">Structured evidence flows into the language model; the LLM never invents review labels.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="225" width="210" height="150" rx="20" class="box"/>
    <text x="165" y="272" text-anchor="middle" class="name">User</text>
    <text x="165" y="306" text-anchor="middle" class="copy">Product question</text>
    <text x="165" y="331" text-anchor="middle" class="copy">or review text</text>

    <rect x="330" y="225" width="230" height="150" rx="20" class="box2"/>
    <text x="445" y="269" text-anchor="middle" class="name">LLM Router</text>
    <text x="445" y="303" text-anchor="middle" class="copy">Chooses the tool</text>
    <text x="445" y="328" text-anchor="middle" class="copy">and validates input</text>

    <rect x="620" y="225" width="230" height="150" rx="20" class="box"/>
    <text x="735" y="269" text-anchor="middle" class="name">Review Store</text>
    <text x="735" y="303" text-anchor="middle" class="copy">title, body, pros, cons</text>
    <text x="735" y="328" text-anchor="middle" class="copy">and observed status</text>

    <rect x="910" y="225" width="250" height="150" rx="20" class="box2"/>
    <text x="1035" y="265" text-anchor="middle" class="name">Resolver</text>
    <text x="1035" y="299" text-anchor="middle" class="copy">Keep observed labels</text>
    <text x="1035" y="324" text-anchor="middle" class="copy">Predict only missing labels</text>
    <rect x="945" y="341" width="180" height="24" rx="12" class="pill"/><text x="1035" y="358" text-anchor="middle" class="pilltext">v2.0.0 classifier</text>

    <rect x="900" y="485" width="270" height="165" rx="20" class="box"/>
    <text x="1035" y="528" text-anchor="middle" class="name">Product Aggregator</text>
    <text x="1035" y="562" text-anchor="middle" class="copy">Counts and percentages</text>
    <text x="1035" y="587" text-anchor="middle" class="copy">by the three labels</text>
    <text x="1035" y="617" text-anchor="middle" class="tiny">Includes source + model version</text>

    <rect x="600" y="485" width="240" height="165" rx="20" class="result"/>
    <text x="720" y="527" text-anchor="middle" class="name">Grounded LLM</text>
    <text x="720" y="561" text-anchor="middle" class="copy">Explains the evidence</text>
    <text x="720" y="586" text-anchor="middle" class="copy">in natural language</text>
    <text x="720" y="617" text-anchor="middle" class="tiny">No label guessing</text>

    <rect x="300" y="485" width="240" height="165" rx="20" class="box"/>
    <text x="420" y="527" text-anchor="middle" class="name">Final Answer</text>
    <text x="420" y="561" text-anchor="middle" class="copy">Recommendation summary</text>
    <text x="420" y="586" text-anchor="middle" class="copy">with caveats</text>
    <text x="420" y="617" text-anchor="middle" class="tiny">Traceable to review evidence</text>
  </g>

  <path d="M270 300H330" class="flow"/><path d="M560 300H620" class="flow"/><path d="M850 300H910" class="flow"/>
  <path d="M1035 375V485" class="flow"/><path d="M900 567H840" class="flow"/><path d="M600 567H540" class="flow"/>
  <text x="300" y="286" text-anchor="middle" class="stepno">1</text><text x="590" y="286" text-anchor="middle" class="stepno">2</text><text x="880" y="286" text-anchor="middle" class="stepno">3</text>
  <text x="1050" y="434" class="stepno">4</text><text x="870" y="553" text-anchor="middle" class="stepno">5</text><text x="570" y="553" text-anchor="middle" class="stepno">6</text>

  <rect x="60" y="708" width="1280" height="70" rx="16" class="policy"/>
  <text x="92" y="736" class="policytext" font-weight="700">Core policy</text>
  <text x="92" y="760" class="copy">Observed recommendation status is authoritative. Softmax values are uncalibrated model scores, not guaranteed probabilities.</text>
</svg>

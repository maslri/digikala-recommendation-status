<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Training and evaluation pipeline for Digikala recommendation status v2</title>
  <desc id="desc">The verified sequence from six million scanned rows to group-safe splits, full fine-tuning, locked test evaluation, bootstrap analysis, and release approval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102841"/></linearGradient>
    <linearGradient id="pass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#059669"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#5eead4"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#eaf4ff}.eyebrow{font-size:16px;letter-spacing:2px;fill:#5eead4}.title{font-size:40px;font-weight:750}.sub{font-size:18px;fill:#bdd3e7}.card{fill:#112a42;stroke:#315779;stroke-width:2}.card2{fill:#123947;stroke:#2dd4bf;stroke-width:2}.head{font-size:21px;font-weight:730}.body{font-size:15px;fill:#bdd3e7}.metric{font-size:26px;font-weight:800;fill:#67e8f9}.small{font-size:13px;fill:#9db7cb}.line{stroke:#5eead4;stroke-width:3;fill:none;marker-end:url(#arrow)}.tag{fill:#1e3a55}.tagtext{font-size:13px;font-weight:700}.pass{fill:url(#pass);stroke:#6ee7b7;stroke-width:2}.check{font-size:28px;font-weight:900;fill:#d1fae5}.split{fill:#0c1e31;stroke:#35536d}.accent{fill:#fbbf24}
    </style>
  </defs>
  <rect width="1400" height="900" rx="28" fill="url(#bg)"/>
  <text x="70" y="65" class="eyebrow">REPRODUCIBLE MODEL PIPELINE</text>
  <text x="70" y="115" class="title">From raw comments to an approved v2 release</text>
  <text x="70" y="150" class="sub">Selection used validation; the locked test set was opened once in the final phase.</text>

  <rect x="60" y="205" width="250" height="170" rx="20" class="card"/>
  <text x="85" y="242" class="head">1. Source scan</text><text x="85" y="286" class="metric">6,156,289</text><text x="85" y="313" class="body">rows scanned</text>
  <text x="85" y="344" class="small">5,261,863 valid-label rows</text>

  <rect x="355" y="205" width="250" height="170" rx="20" class="card"/>
  <text x="380" y="242" class="head">2. Clean and group</text><text x="380" y="286" class="metric">5,259,005</text><text x="380" y="313" class="body">unique non-empty rows</text>
  <text x="380" y="344" class="small">Duplicates removed; text groups locked</text>

  <rect x="650" y="205" width="335" height="170" rx="20" class="card2"/>
  <text x="675" y="242" class="head">3. Group-safe split</text>
  <rect x="675" y="265" width="285" height="28" rx="10" class="split"/><text x="688" y="285" class="body">Train</text><text x="942" y="285" text-anchor="end" class="tagtext">525,900</text>
  <rect x="675" y="300" width="285" height="28" rx="10" class="split"/><text x="688" y="320" class="body">Validation</text><text x="942" y="320" text-anchor="end" class="tagtext">9,941</text>
  <rect x="675" y="335" width="285" height="28" rx="10" class="split"/><text x="688" y="355" class="body">Locked test</text><text x="942" y="355" text-anchor="end" class="tagtext">9,662</text>

  <rect x="1030" y="205" width="310" height="170" rx="20" class="card"/>
  <text x="1055" y="242" class="head">4. Targeted train mix</text>
  <text x="1055" y="285" class="body">70% recommended</text><text x="1055" y="315" class="body">14% not_recommended</text><text x="1055" y="345" class="body">16% no_idea</text>
  <circle cx="1304" cy="280" r="9" fill="#2dd4bf"/><circle cx="1304" cy="312" r="9" fill="#60a5fa"/><circle cx="1304" cy="344" r="9" fill="#fbbf24"/>

  <path d="M310 290H355" class="line"/><path d="M605 290H650" class="line"/><path d="M985 290H1030" class="line"/>

  <rect x="120" y="470" width="320" height="185" rx="20" class="card2"/>
  <text x="145" y="508" class="head">5. Validation-gated final fit</text><text x="145" y="548" class="metric">1.947 epochs</text>
  <text x="145" y="579" class="body">535,841 train + validation rows</text><text x="145" y="605" class="body">All layers · FP16 · Tesla T4</text><text x="145" y="633" class="small">Final fit: 22,472.8 seconds</text>

  <rect x="520" y="470" width="320" height="185" rx="20" class="card"/>
  <text x="545" y="508" class="head">6. Locked test evaluation</text><text x="545" y="548" class="metric">Macro-F1 0.7292</text>
  <text x="545" y="579" class="body">Accuracy 0.8470</text><text x="545" y="605" class="body">Weighted-F1 0.8606</text><text x="545" y="633" class="small">v1 reproduced exactly: 0.7172</text>

  <rect x="920" y="470" width="360" height="185" rx="20" class="card"/>
  <text x="945" y="508" class="head">7. Group-level bootstrap</text><text x="945" y="548" class="metric">1,000 iterations</text>
  <text x="945" y="579" class="body">Paired delta CI95</text><text x="945" y="605" class="body">[0.0036, 0.0202]</text><text x="945" y="633" class="small">P(new model better) = 0.997</text>

  <path d="M1185 375V424H280V470" class="line"/><path d="M440 562H520" class="line"/><path d="M840 562H920" class="line"/>

  <rect x="330" y="735" width="740" height="105" rx="24" class="pass"/>
  <text x="380" y="785" class="check">PASS</text><text x="500" y="780" class="head">PASS_PROMOTE_V2</text><text x="500" y="809" class="body">All mandatory release gates passed; v1 remains the rollback artifact.</text>
  <path d="M1100 655V690H700V735" class="line"/>
  <rect x="1110" y="748" width="230" height="76" rx="16" class="tag"/>
  <text x="1225" y="778" text-anchor="middle" class="tagtext">Release version</text><text x="1225" y="804" text-anchor="middle" class="small">10pct-v2.0.0</text>
</svg>
